[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Backend for Repository-Explorer: analyzes a GitHub repository into a dependency graph, file summaries, PR rationale and an architecture map."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "ollama>=0.6.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]
